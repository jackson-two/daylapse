name: Bug report
description: Report a reproducible problem using synthetic data.
body:
  - type: markdown
    attributes:
      value: For security vulnerabilities, follow SECURITY.md. Never include credentials, private display URLs, household exports, or personal data.
  - type: textarea
    id: problem
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce with synthetic data
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Version, browser/device, and relevant setup
      description: Include sanitized error messages only.
